<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todomix Admin</title><style>body{font-family:Arial;background:#f3f6fa;max-width:1050px;margin:auto;padding:25px}section{background:#fff;padding:20px;margin:15px 0;border-radius:14px}input,select{padding:11px;width:100%;margin:6px 0;box-sizing:border-box}button{padding:11px 15px;background:#147cf5;color:#fff;border:0;border-radius:8px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.danger{background:#d33}.stats{display:flex;gap:10px}.stat{background:#121826;color:#fff;padding:18px;border-radius:10px;flex:1}@media(max-width:700px){.stats{display:block}.stat{margin:8px 0}}</style><body><h1>🛒 Todomix — Administración</h1><section id="login"><input id="pw" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><p id="m"></p></section><main id="panel" hidden><section><div id="stats" class="stats"></div></section><section><h2>Agregar producto</h2><input id="n" placeholder="Nombre"><select id="c"><option>Tecnología</option><option>Ropa</option><option>Hogar</option><option>Belleza</option><option>Deportes</option><option>Electrónica</option><option>Otros</option></select><input id="p" type="number" step=".01" placeholder="Precio"><input id="o" type="number" step=".01" placeholder="Precio anterior"><input id="s" type="number" placeholder="Inventario"><input id="i" placeholder="Emoji"><button onclick="add()">Agregar</button></section><section><h2>Productos</h2><div id="ps"></div></section><section><h2>Pedidos</h2><div id="os"></div></section></main><script>async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})});if(r.ok){login.hidden=true;panel.hidden=false;load()}else m.textContent="Clave incorrecta"}async function load(){let[p,o]=await Promise.all([fetch("/api/admin/products").then(r=>r.json()),fetch("/api/admin/orders").then(r=>r.json())]);stats.innerHTML=`<div class=stat>Productos<br><b>${p.length}</b></div><div class=stat>Pedidos<br><b>${o.length}</b></div><div class=stat>Pagados<br><b>${o.filter(x=>x.paymentStatus=="paid").length}</b></div>`;ps.innerHTML=p.map(x=>`<div class=row><span>${x.icon} <b>${x.name}</b><br>$${x.price.toFixed(2)} · stock ${x.stock}</span><button class=danger onclick="del('${x.id}')">Eliminar</button></div>`).join("");os.innerHTML=o.length?o.map(x=>`<div class=row>#${x.id} · ${x.customer?.name||"Cliente"} · $${x.total.toFixed(2)} · ${x.paymentStatus}</div>`).join(""):"Sin pedidos"}async function add(){let r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n.value,category:c.value,price:+p.value,oldPrice:+o.value||0,stock:+s.value||0,icon:i.value||"📦"})});if(!r.ok)return alert((await r.json()).error);n.value=p.value=o.value=s.value=i.value="";load()}async function del(id){if(confirm("¿Eliminar?")){await fetch("/api/admin/products/"+id,{method:"DELETE"});load()}}</script></body></html>
